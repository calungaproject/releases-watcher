apiVersion: apps/v1
kind: Deployment
metadata:
  name: calunga-release-watcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calunga-release-watcher
  template:
    metadata:
      labels:
        app: calunga-release-watcher
        paas.redhat.com/appcode: RHPI-001
    spec:
      containers:
        - name: controller
          image: quay.io/rhopp/calunga-release-watcher:latest
          imagePullPolicy: IfNotPresent
          command: ["kopf", "run"]
          args:
            - "--liveness=http://0.0.0.0:8080/healthz"
            - "--namespace=$(TENANT_NAMESPACE)"
            - "--namespace=$(RELEASE_NAMESPACE)"
            - "-m"
            - "calunga_release_watcher.handlers"
          envFrom:
            - configMapRef:
                name: calunga-release-watcher-config
          env:
            - name: K8S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: calunga-release-watcher-secrets
                  key: k8s-token
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: calunga-release-watcher-secrets
                  key: slack-token
                  optional: true
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/gcp/sa-key.json
            - name: HTTPS_PROXY
              value: "http://proxy.squi-001.prod.iad2.dc.redhat.com:3128"
            - name: HTTP_PROXY
              value: "http://proxy.squi-001.prod.iad2.dc.redhat.com:3128"
            - name: NO_PROXY
              value: ".svc,.cluster.local,10.0.0.0/8,172.0.0.0/8"
          volumeMounts:
            - name: gcp-sa-key
              mountPath: /var/run/secrets/gcp
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: gcp-sa-key
          secret:
            secretName: calunga-release-watcher-secrets
            items:
              - key: gcp-sa-key
                path: sa-key.json
            optional: true
