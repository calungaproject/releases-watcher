apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-watcher
spec:
  selector:
    matchLabels:
      app: lightwell-python-release-watcher
  template:
    metadata:
      labels:
        app: lightwell-python-release-watcher
        paas.redhat.com/appcode: RHPI-001
    spec:
      containers:
        - name: controller
          env:
            - name: K8S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lightwell-python-release-watcher-secret
                  key: k8s-token
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lightwell-python-release-watcher-secret
                  key: slack-token
                  optional: true
            - name: SLACK_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: lightwell-python-release-watcher-secret
                  key: slack-channel
            - name: NO_PROXY
              value: ".svc,.cluster.local,10.0.0.0/8,172.0.0.0/8"
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "500m"
      volumes:
        - name: gcp-sa-key
          secret:
            secretName: lightwell-python-release-watcher-secret
            items:
              - key: gcp-sa-key
                path: sa-key.json
            optional: true
